<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2EFE9"/>
      <stop offset="100%" stop-color="#E5E0D8"/>
    </linearGradient>
    <pattern id="dotPattern1" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#D3CEBF"/>
    </pattern>
  </defs>
  <rect width="640" height="400" fill="url(#bgGrad1)"/>
  <rect width="640" height="400" fill="url(#dotPattern1)"/>
  
  <!-- Sketch Clapperboard -->
  <g transform="translate(190, 85)">
    <!-- Base Board -->
    <rect x="0" y="70" width="260" height="170" rx="14" fill="#FFFFFF" stroke="#111111" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Top Clapper sticks -->
    <g transform="rotate(-12, 10, 60)">
      <rect x="0" y="10" width="260" height="46" rx="8" fill="#111111" stroke="#111111" stroke-width="2"/>
      <!-- Diagonal white stripes -->
      <path d="M30 10 L60 56 M90 10 L120 56 M150 10 L180 56 M210 10 L240 56" stroke="#FFE500" stroke-width="12" stroke-linecap="round"/>
    </g>
    
    <!-- Film slate content -->
    <line x1="25" y1="120" x2="235" y2="120" stroke="#E2E2E2" stroke-width="2"/>
    <line x1="130" y1="120" x2="130" y2="210" stroke="#E2E2E2" stroke-width="2"/>
    <text x="35" y="105" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#888888" letter-spacing="1.5">AI AD FILM // SCENE 01</text>
    <text x="35" y="150" font-family="'Permanent Marker', cursive" font-size="24" fill="#111111">TAKE 04</text>
    <text x="35" y="185" font-family="'Patrick Hand', cursive" font-size="16" fill="#666666">PROMPT: 8K CINEMATIC</text>
    
    <text x="145" y="150" font-family="'Permanent Marker', cursive" font-size="24" fill="#FFE500" stroke="#111" stroke-width="1">AI GEN</text>
    <text x="145" y="185" font-family="'Patrick Hand', cursive" font-size="16" fill="#666666">FPS: 24 · HDR10</text>
    
    <!-- AI Sparkles -->
    <g transform="translate(235, 45) scale(1.2)">
      <path d="M0 15 Q15 15 15 0 Q15 15 30 15 Q15 15 15 30 Q15 15 0 15 Z" fill="#FFE500" stroke="#111111" stroke-width="2"/>
    </g>
    <g transform="translate(-25, 160) scale(0.8)">
      <path d="M0 15 Q15 15 15 0 Q15 15 30 15 Q15 15 15 30 Q15 15 0 15 Z" fill="#FFE500" stroke="#111111" stroke-width="2"/>
    </g>
  </g>
</svg>