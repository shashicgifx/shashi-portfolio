<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2F4F7"/>
      <stop offset="100%" stop-color="#E2E7EE"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#bgGrad4)"/>
  
  <!-- Onion Skinning / 12 Principles Animation Frames -->
  <g transform="translate(140, 80)">
    <!-- Frame 1 (Ghost) -->
    <g transform="translate(0, 30) rotate(-10)">
      <rect x="0" y="0" width="140" height="180" rx="10" fill="#FFFFFF" opacity="0.4" stroke="#111111" stroke-width="2" stroke-dasharray="3 3"/>
      <circle cx="70" cy="90" r="30" fill="none" stroke="#999" stroke-width="2"/>
    </g>
    
    <!-- Frame 2 (Ghost 2) -->
    <g transform="translate(80, 10) rotate(-4)">
      <rect x="0" y="0" width="140" height="180" rx="10" fill="#FFFFFF" opacity="0.7" stroke="#111111" stroke-width="2"/>
      <circle cx="70" cy="90" r="30" fill="none" stroke="#666" stroke-width="2"/>
    </g>
    
    <!-- Frame 3 (Main Keyframe) -->
    <g transform="translate(170, 0) rotate(5)">
      <rect x="0" y="0" width="160" height="200" rx="12" fill="#FFFFFF" stroke="#111111" stroke-width="3"/>
      
      <!-- Character eye / face doodle sketch -->
      <circle cx="80" cy="85" r="40" fill="#FFE500" stroke="#111" stroke-width="3"/>
      <circle cx="68" cy="80" r="6" fill="#111"/>
      <circle cx="92" cy="80" r="6" fill="#111"/>
      <path d="M 68 102 Q 80 115 92 102" fill="none" stroke="#111" stroke-width="3" stroke-linecap="round"/>
      
      <!-- Timing pegs bar on bottom -->
      <rect x="20" y="160" width="120" height="16" rx="4" fill="#F4F3F0" stroke="#111" stroke-width="1.5"/>
      <circle cx="40" cy="168" r="3.5" fill="#111"/>
      <rect x="75" y="165" width="10" height="6" fill="#111"/>
      <circle cx="120" cy="168" r="3.5" fill="#111"/>
    </g>
    
    <!-- Bouncing motion arc -->
    <path d="M 50 215 Q 180 140 330 215" fill="none" stroke="#111111" stroke-width="2.5" stroke-dasharray="6 4"/>
    <text x="180" y="235" font-family="'Patrick Hand', cursive" font-size="16" fill="#444" text-anchor="middle">squash &amp; stretch · 24fps</text>
  </g>
</svg>