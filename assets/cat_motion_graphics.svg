<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4EFE6"/>
      <stop offset="100%" stop-color="#EAE3D5"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#bgGrad3)"/>
  
  <!-- Motion Curves and Kinetic Shapes -->
  <g transform="translate(130, 75)">
    <!-- Main white card -->
    <rect x="0" y="0" width="380" height="250" rx="16" fill="#FFFFFF" stroke="#111111" stroke-width="3"/>
    
    <!-- Bezier Curve with Keyframe Handles -->
    <path d="M 40 190 C 120 190, 140 60, 240 60 C 310 60, 310 180, 340 180" fill="none" stroke="#111111" stroke-width="3.5" stroke-linecap="round"/>
    
    <!-- Tangent lines -->
    <line x1="80" y1="190" x2="160" y2="190" stroke="#FFE500" stroke-width="2.5"/>
    <circle cx="80" cy="190" r="4.5" fill="#111111"/>
    <circle cx="160" cy="190" r="4.5" fill="#111111"/>
    
    <line x1="190" y1="60" x2="280" y2="60" stroke="#FFE500" stroke-width="2.5"/>
    <circle cx="190" cy="60" r="4.5" fill="#111111"/>
    <circle cx="280" cy="60" r="4.5" fill="#111111"/>
    
    <!-- Kinetic Floating Geometric Prisms -->
    <!-- Cube 1 -->
    <g transform="translate(60, 60)">
      <polygon points="30,0 60,15 30,30 0,15" fill="#FFE500" stroke="#111" stroke-width="2"/>
      <polygon points="0,15 30,30 30,60 0,45" fill="#E6CE00" stroke="#111" stroke-width="2"/>
      <polygon points="30,30 60,15 60,45 30,60" fill="#FFF275" stroke="#111" stroke-width="2"/>
    </g>
    
    <!-- Torus / Ring -->
    <ellipse cx="270" cy="140" rx="35" ry="18" fill="none" stroke="#111111" stroke-width="3" transform="rotate(-20 270 140)"/>
    <ellipse cx="270" cy="140" rx="20" ry="10" fill="none" stroke="#FFE500" stroke-width="3" transform="rotate(-20 270 140)"/>
    
    <text x="190" y="225" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#111" text-anchor="middle" letter-spacing="2">KEYFRAME · EASE IN/OUT</text>
  </g>
</svg>