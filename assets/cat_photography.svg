<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6F5F2"/>
      <stop offset="100%" stop-color="#E8E6E0"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#bgGrad6)"/>
  
  <!-- Camera Viewfinder & Aperture Iris -->
  <g transform="translate(140, 75)">
    <!-- Viewfinder Screen -->
    <rect x="0" y="0" width="360" height="250" rx="14" fill="#FFFFFF" stroke="#111111" stroke-width="3"/>
    
    <!-- Rule of thirds lines -->
    <line x1="120" y1="20" x2="120" y2="230" stroke="#EEEEEE" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="240" y1="20" x2="240" y2="230" stroke="#EEEEEE" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="20" y1="85" x2="340" y2="85" stroke="#EEEEEE" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="20" y1="165" x2="340" y2="165" stroke="#EEEEEE" stroke-width="1.5" stroke-dasharray="4 4"/>
    
    <!-- Viewfinder Corner brackets -->
    <path d="M 30 50 L 30 35 L 45 35" fill="none" stroke="#111" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 330 50 L 330 35 L 315 35" fill="none" stroke="#111" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 30 200 L 30 215 L 45 215" fill="none" stroke="#111" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 330 200 L 330 215 L 315 215" fill="none" stroke="#111" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Center Aperture Blades -->
    <g transform="translate(180, 125)">
      <circle cx="0" cy="0" r="55" fill="#F4F3F0" stroke="#111111" stroke-width="3"/>
      <!-- Aperture blades -->
      <polygon points="0,-48 30,-20 0,-15" fill="#FFE500" stroke="#111" stroke-width="1.5"/>
      <polygon points="45,-15 35,22 15,5" fill="#FFE500" stroke="#111" stroke-width="1.5"/>
      <polygon points="30,35 -15,40 0,15" fill="#FFE500" stroke="#111" stroke-width="1.5"/>
      <polygon points="-35,30 -42,-10 -15,5" fill="#FFE500" stroke="#111" stroke-width="1.5"/>
      <polygon points="-25,-35 15,-40 -5,-15" fill="#FFE500" stroke="#111" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="14" fill="#111"/>
    </g>
    
    <!-- Camera exposure readout -->
    <text x="40" y="235" font-family="'Space Mono', monospace" font-size="10" font-weight="700" fill="#111">ISO 100 · 50mm · f/1.4 · 1/250s</text>
    <text x="320" y="235" font-family="'Permanent Marker', cursive" font-size="13" fill="#FFE500" stroke="#111" stroke-width="0.8" text-anchor="end">RAW</text>
  </g>
</svg>